# statix.toml —— statix（Nix 静态 lint 工具）仓库级配置。
# 作用：保留 bug 类检查，仅关闭与仓库书写风格冲突的两项纯风格 lint：
#   manual_inherit_from（与点式属性风格冲突）、repeated_keys（调色板数据
#   文件允许同键组织，属可接受写法）。
# 生效机制：statix 在仓库根目录自动读取本文件（flake checks.lint 引用）。
# ignore：hardware-configuration.nix 由 nixos-generate-config 自动生成，
#   非手工维护，故跳过检查。
# --- statix ---
# Keep the bug-finding lints; drop the two purely stylistic ones that fight the
# repo's dotted-attribute and palette style (both are acceptable here).
disabled = [ "manual_inherit_from", "repeated_keys" ]

# Auto-generated by nixos-generate-config; not hand-edited.
ignore = [ "**/hardware-configuration.nix" ]
