# ============================================================================
# hyprlock.conf —— 锁屏界面配置
# ----------------------------------------------------------------------------
# 安装位置：~/.config/hypr/hyprlock.conf（由 ../hyprlock.nix 安装）
#
# hyprlock 配置采用「区块 + 变量」格式，每个区块对应一个界面元素：
#   general       行为总开关
#   background    背景（截图模糊 / 纯色）
#   image         图片（用户头像、壁纸）
#   label         文本（问候、时钟、日期、系统信息、键盘布局）
#   input-field   密码输入框
#
# 常用变量：
#   monitor       为空表示应用到所有显示器（多屏时各自渲染一份）
#   position      X,Y 坐标；halign/valign 决定对齐方式
#   text          支持 Pango 富文本标记（<span>、font_weight 等）
#   $USER        环境变量：当前用户名
#   cmd[update:N] 以 N 毫秒为周期执行命令，动态刷新文本
#   $LAYOUT[..]   键盘布局（fcitx5 中文环境下可用于提示中英文状态）
#
# 注意：path = screenshot 表示「直接把当前屏幕截图作为背景」并做模糊处理，
#      这样锁屏时仍能隐约看到桌面内容。若想换成静态图片，
#      取消下方被注释的 path 行并填入图片绝对路径即可。
# ============================================================================

# ---- 行为总开关 ----
general {
    hide_cursor = true      # 锁屏后隐藏鼠标指针
    immediate_render = true # 立即渲染（避免过渡动画造成的延迟感）
    no_fade_in = false      # 保留淡入动画
    fail_timeout = 2500     # 密码错误后的锁定时长（毫秒），防止暴力破解
}

# ---- 背景设置：柔焦效果 ----
background {
    monitor =                    # 空值 = 所有显示器
    path = screenshot            # 使用「当前屏幕截图」作为背景
    # path = /home/youth/wallpapers/wallpaper1.png  # 备选：指定静态图片作为背景
    blur_passes = 3    # 适度模糊（次数越多越模糊，也越耗 GPU）
    blur_size = 8      # 柔和程度（模糊半径）
    noise = 0.03       # 轻微噪点（掩盖背景细节，同时有磨砂质感）
    contrast = 0.95    # 柔和对比
    brightness = 1.02  # 稍亮背景，保证前景文字清晰
    # color =  rgba(44, 51, 71, 0.9)  # 备选：不用截图时直接指定半透明纯色
}

# ---- 用户头像：圆形设计 ----
image {
    monitor =
    size = 128                                # 直径（像素）
    rounding = -1      # 正圆形（-1 表示完全圆形）
    border_size = 3                            # 边框宽度
    border_color = rgba(143, 188, 187, 0.8) # 薄荷绿边框
    position = 0, -180                        # 相对屏幕中心向上偏移 180px
    halign = center
    valign = center
    shadow_passes = 2                          # 头像投影计算次数
    shadow_size = 5                            # 投影扩散
    shadow_color = rgba(0, 0, 0, 0.15)         # 投影颜色与透明度
}

# ---- 用户名显示：中文友好字体 ----
label {
    monitor =
    text = <span font_weight="bold">你好，$USER</span>  # Pango 富文本加粗；$USER 由 hyprlock 替换
    color = rgba(236, 239, 244, 0.9) # 雪白色
    font_size = 24
    font_family = "LXGW WenKai Screen" # 中文字体（霞鹜文楷），中文观感更佳
    position = 0, -120          # 位于头像与时钟之间
    halign = center
    valign = center
}

# ---- 时间显示：主视觉焦点 ----
label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='bold'>$(date +"%H:%M")</span>"  # 每秒刷新
    color = rgba(216, 222, 233, 0.95) # 淡冰川蓝
    font_size = 64                   # 大字号，形成视觉焦点
    font_family = "JetBrains Mono Nerd Font"  # Nerd 字体，含图标字形
    position = 0, 0                  # 屏幕正中心
    halign = center
    valign = center
}

# ---- 日期显示：中文格式 ----
label {
    monitor =
    text = cmd[update:60000] echo "<span>$(LC_TIME=zh_CN.UTF-8 date +"%Y年%m月%d日 %A")</span>"  # 每分钟刷新
    color = rgba(180, 196, 211, 0.9) # 浅钢蓝
    font_size = 18
    font_family = "LXGW WenKai Screen"
    position = 0, 70          # 位于时钟下方
    halign = center
    valign = center
}

# ---- 密码输入框：圆润设计 ----
input-field {
    monitor =
    size = 360, 56                # 宽度 360，高度 56
    outline_thickness = 0         # 去掉默认描边（用背景色代替）
    dots_size = 0.3               # 密码圆点大小
    dots_spacing = 0.15           # 圆点间距
    rounding = 28       # 椭圆造型（高度的一半）
    inner_color = rgba(76, 86, 106, 0.6) # 深灰蓝底色
    font_color = rgb(228, 229, 232)       # 输入文字颜色
    font_family = "JetBrains Mono Nerd Font"
    placeholder_text = <i><span foreground="##a6b0c0">请输入密码...</span></i>  # 占位提示
    hide_input = false  # false = 显示密码圆点；true = 完全隐藏输入内容
    check_color = rgba(163, 190, 140, 1.0) # 验证成功的颜色（抹茶绿）
    fail_color = rgba(191, 97, 106, 1.0)   # 验证失败的边框色（珊瑚红）
    fail_text = <i><span foreground="##BF616A">$FAIL (尝试 $ATTEMPTS 次)</span></i>  # 失败提示
    position = 0, 150       # 位于日期下方
    halign = center
    valign = center
}

# ---- 系统信息：主机名与运行时长 ----
label {
    monitor =
    text = cmd[update:10000] echo "<span>$(uname -n) · 运行 $(uptime -p | sed -e 's/up //' -e 's/days/天/' -e 's/hours/小时/' -e 's/minutes/分钟/')</span>"  # 每 10 秒刷新；sed 把英文时长转中文
    color = rgba(158, 173, 191, 0.8) # 灰蓝色
    font_size = 12                   # 小字号，保持信息层级
    font_family = "LXGW WenKai Screen"
    position = 20, -20               # 左下角
    halign = left
    valign = bottom
}

# ---- 键盘布局 / 输入法状态：中文标识 ----
label {
    monitor =
    text = <span>$LAYOUT[EN,中文]</span>  # $LAYOUT 为当前布局，后两字为状态提示
    color = rgba(166, 218, 214, 0.9) # 浅水绿色
    font_size = 14
    font_family = "LXGW WenKai Screen"
    position = -20, -20              # 右下角
    halign = right
    valign = bottom
}

# ---- 指纹提示：中文显示 ----
# 说明：仅当 fprintd 服务处于 active 状态时才显示文字，
#      未安装指纹设备时该标签为空，不会留下多余空白。
label {
    monitor =
    text = cmd[update:1000] if [ "$(systemctl is-active fprintd)" = "active" ]; then echo "<span font_size='14'>🖐️ 指纹识别就绪</span>"; fi
    color = rgba(166, 218, 214, 0.9) # 与水绿色统一
    position = 0, 100                # 位于日期与密码框之间
    halign = center
    valign = center
}
