# =============================================================================
#  fcitx5 经典界面（classicui）配置
# -----------------------------------------------------------------------------
#  部署：home.file → ~/.config/fcitx5/conf/classicui.conf
#  Theme=youth → 对应 ~/.local/share/fcitx5/themes/youth/theme.conf
#  （主题配色由 vars.theme.* 注入，见 dotfiles/fcitx5/theme.conf）
# =============================================================================
# 主题名（必须等于 ~/.local/share/fcitx5/themes/ 下的目录名，或 fcitx5 内置主题名）
# 由 vars.inputMethod.theme 注入：youth（跟随桌面配色）/ default / dark（内置）
Theme=@imeTheme@

# 候选词横排（False）/ 竖排（True）
Vertical Candidate List=False

# 高分屏下按屏幕 DPI 缩放
PerScreenDPI=True

# 鼠标滚轮翻页
WheelForPaging=True

# 候选栏 / 菜单字体
Font=@fontFamily@ @fontSize@
MenuFont=@fontFamily@ @fontSize@
