# =============================================================================
#  fcitx5 classicui 主题：youth（配色跟随 vars.theme.*）
# -----------------------------------------------------------------------------
#  部署：home.file → ~/.local/share/fcitx5/themes/youth/theme.conf
#  生效：由 ~/.config/fcitx5/conf/classicui.conf 里的 Theme=youth 选中
#
#  格式说明（classicui 的 theme.conf 是 INI）：
#    [Metadata]       主题元信息；ScaleWithDPI=True 表示高分屏自动放大
#    [InputPanel]     候选栏：字体 / 各项颜色 / 间距
#    [InputPanel/Background]      候选栏背景（色 + 边框）
#    [InputPanel/Highlight]       高亮（当前选中）区域的底色
#    [InputPanel/TextMargin]      文字内边距
#    [Menu/*]         右键菜单的同类设置
# =============================================================================
[Metadata]
Name=youth
Version=1
Author=youth
Description=Follow the niri desktop theme (accent @accent@)
ScaleWithDPI=True

[InputPanel]
Font=@fontFamily@ @fontSize@
# 非选中候选字颜色
NormalColor=#@foreground@
# 选中候选字颜色
HighlightCandidateColor=#@background@
# 高亮前景色（正在输入的拼音串颜色）
HighlightColor=#@accent@
# 高亮区域背景色
HighlightBackgroundColor=#@background@
# 拼音串与候选词之间的间距
Spacing=3

[InputPanel/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

[InputPanel/Background]
Color=#@background@
BorderColor=#@accent@
BorderWidth=1

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color=#@accent@

[InputPanel/Highlight/Margin]
Left=10
Right=10
Top=7
Bottom=7

[Menu/Background]
Color=#@background@

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#@accent@

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Separator]
Color=#@foreground@

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
