# =============================================================================
#  kitty 终端配置
# -----------------------------------------------------------------------------
#  部署方式：home-manager 的 home.file → ~/.config/kitty/kitty.conf
#  变量来源：vars.nix（fonts.mono.* / theme.*），占位符（如 @fontFamily@）在构建期替换
#  ⚠️ 本文件里任何 @…@ 都必须是 modules/home/kitty.nix 里提供的键（注释里也不行），
#     否则 replaceVars 会当成未替换占位符并让构建失败
#  详细说明（每个选项怎么改、常用玩法）：doc/kitty.md
#  官方文档：https://sw.kovidgoyal.net/kitty/conf/
# =============================================================================

# ---- 字体 --------------------------------------------------------------------
#  字体族名必须和 fontconfig 里看到的一致，校验方法：
#    fc-list | grep -i maple
#  若显示不出来，改 vars.nix 里的 fonts.mono.family
font_family                     @fontFamily@
font_size                       @fontSize@

bold_font                       auto
italic_font                     auto
bold_italic_font                auto
# Maple Mono 是连字字体，这里保持启用连字
disable_ligatures               never

# ---- 精简外观 ----------------------------------------------------------------
#  去掉系统标题栏/边框（窗口装饰交给 niri 的边框来画）
hide_window_decorations         yes
#  轻微透明的磨砂感；不想要就改成 1.0
background_opacity              0.94
#  终端内容与窗口之间的内边距
window_padding_width            8
#  单窗口时居中
placement_strategy              center
#  关掉“确认关闭”弹窗
confirm_os_window_close         0
#  关掉刺耳的响铃
enable_audio_bell               no
#  允许终端内超链接
allow_hyperlinks                yes

# ---- 标签栏（精简）------------------------------------------------------------
tab_bar_edge                    top
tab_bar_style                   powerline
tab_bar_min_tabs                2
tab_bar_margin_width            8
active_tab_foreground           @background@
active_tab_background           @accent@
inactive_tab_foreground         @foreground@
tab_activity_symbol             none
tab_title_template              "{index}: {title}"

# ---- 滚动与历史 ---------------------------------------------------------------
scrollback_lines                10000
scrollback_pager                less --chop-long-lines
mouse_hide_wait                 3.0
wheel_scroll_multiplier         5.0

# ---- 光标 --------------------------------------------------------------------
cursor                          @cursor@
cursor_text_color               @background@
cursor_shape                    block
cursor_blink_interval           0

# ---- 配色（极简：只定义必要项，其余由 kitty 默认推导）---------------------------
foreground                      @foreground@
background                      @background@
selection_foreground            @background@
selection_background            @accent@
url_color                       @accent@
active_border_color             @accent@
# 窗口边距（hide_window_decorations 时基本不可见，保留以防关闭该选项）
window_margin_width             0

# ---- kitty 的 shell 集成 ------------------------------------------------------
#  配合 dotfiles/zsh/.zshrc 里的 kitty-integration 使用
#  提供：提示符标记、Ctrl+Z 跳转到编辑器、clone-in-kitty 等
shell_integration               enabled

# ---- 快捷键（沿用 kitty 默认修饰键 ctrl+shift）---------------------------------
#  kitty_mod 保持默认 ctrl+shift，避免和 niri 的 super 冲突
map ctrl+shift+enter            new_window_with_cwd
map ctrl+shift+t                new_tab_with_cwd
map ctrl+shift+bracketright     next_tab
map ctrl+shift+bracketleft      previous_tab
# 字体大小调节
map ctrl+shift+equal            change_font_size all +1.0
map ctrl+shift+minus            change_font_size all -1.0
map ctrl+shift+backspace        change_font_size all 0
