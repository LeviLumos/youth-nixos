# =============================================================================
#  Rime 输入法定制（雾凇拼音 rime-ice 的用户配置）
# -----------------------------------------------------------------------------
#  部署：home.file → ~/.local/share/fcitx5/rime/default.custom.yaml
#  作用：把 Rime 的默认方案从「朙月拼音」切成「雾凇双拼」（double_pinyin）
#
#  ⚠️ 本文件只负责【选方案】；雾凇的方案文件与词库不在 nix 里（要访问 GitHub），
#     用一条命令装进同一个目录：just rime-ice（见 justfile）
#  ⚠️ 雾凇的双拼默认是【自然码】键位；想要小鹤/微软等其它键位，
#     参考仓库 README 的 double_pinyin.custom.yaml 示例（https://github.com/iDvel/rime-ice）
# =============================================================================
patch:
  # 输入方案列表：只留雾凇双拼；想并列多个方案就往列表里加
  schema_list:
    - schema: double_pinyin

  # 菜单/快捷键沿用雾凇默认（default.yaml），按需取消注释：
  # "menu/page_size": 9        # 候选词个数（默认 9）
  # "switcher/hotkeys":        # 方案切换快捷键（默认 F4 / Control+grave）
  #   - "Control+grave"
