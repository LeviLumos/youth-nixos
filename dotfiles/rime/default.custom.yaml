# =============================================================================
#  Rime 方案选择：默认 = 小鹤双拼（rime-ice 的 double_pinyin_flypy）
# -----------------------------------------------------------------------------
#  部署：home.file → ~/.local/share/fcitx5/rime/default.custom.yaml
#  机制：本文件 patch 掉 rime-ice 自带的 default.yaml，把 schema_list 换成小鹤双拼
#
#  ⚠️ 方案文件与词库不在 nix 里（在 GitHub）：just rime-ice
#  ⚠️ 换双拼方案：改下面的 schema 值即可，rime-ice 里实际存在的文件名：
#       double_pinyin_flypy    小鹤双拼（当前）
#       double_pinyin          自然码
#       double_pinyin_mspy     微软双拼
#       double_pinyin_abc      智能 ABC
#       double_pinyin_jiajia   拼音加加
#       double_pinyin_sogou    搜狗双拼
#       double_pinyin_ziguang  紫光双拼
#       rime_ice / melt_eng    雾凇全拼 / 英文输入
# =============================================================================
patch:
  schema_list:
    - schema: double_pinyin_flypy

  # 没跑 just rime-ice（词库还没装）时，上面那个方案不存在、会没候选词。
  # 这时取消下面两行注释，先用 Rime 自带的「朙月拼音」顶着：
  #   - schema: luna_pinyin

  # ---- 简繁 -------------------------------------------------------------------
  #  默认就是简体（方案里 traditionalization 的 states 是 [简, 繁] 且无 reset）。
  #  这里把 traditionalization 从「方案选单记忆」里去掉：状态不再写进 user.yaml；
  #  配合 double_pinyin_flypy.custom.yaml 的 switches/@2/reset: 0 双保险，
  #  无论怎么按 Ctrl+Shift+4，重启输入法后都回到简体。
  "switcher/save_options":
    - ascii_punct
    - emoji
    - full_shape
    - search_single_char

  # 常用定制位（按需取消注释）：
  # "menu/page_size": 9            # 候选词个数（默认 9）
  # "switcher/hotkeys":            # 方案切换快捷键（默认 F4 / Control+grave）
  #   - "Control+grave"
  # "ascii_composer/good_old_caps_lock": false   # CapsLock 是否切中英
  # "key_binder/bindings/+":       # 例如减号/等号翻页
  #   - { when: paging, accept: minus, send: Page_Up }
  #   - { when: paging, accept: equal, send: Page_Down }
